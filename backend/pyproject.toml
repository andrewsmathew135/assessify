[project]
name = "candidate-assessment-backend"
version = "1.0.0"
description = "Backend for a candidate assessment workflow (FastAPI + python-docx + openpyxl)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends/Query)
